# /etc/nginx/sites-available/aishop
# Host Nginx — SSL termination + proxy to Docker (port 8081)
#
# Установка на сервере:
#   sudo cp docker/nginx-host.conf /etc/nginx/sites-available/aishop
#   sudo ln -s /etc/nginx/sites-available/aishop /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d donor.asia -d www.donor.asia
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name donor.asia www.donor.asia;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name donor.asia www.donor.asia;

    # SSL (certbot заполнит автоматически)
    ssl_certificate /etc/letsencrypt/live/donor.asia/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/donor.asia/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 100M;

    # Proxy to Docker (port 8081)
    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;

        # WebSocket support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }
}

# WebSocket upgrade mapping
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
